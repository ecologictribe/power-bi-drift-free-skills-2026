name: validate

on: [push, pull_request]

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full gate (projects pass, fixtures fail)
        run: python fixtures/check_gate.py
